# Dev pipeline: build API + Admin on push to dev.
# Variables (Settings > Environments > development-ce > Variables):
#   ADMIN_REPO_NAME: nombre de la imagen del admin (ej: accounts-admin). Si está vacío, no se compila el admin.
name: Dev Docker Hub Pipeline

on:
  push:
    branches:
      - dev

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    environment: development
    outputs:
      registry_url: ${{ steps.vars.outputs.registry_url }}
      registry_name: ${{ steps.vars.outputs.registry_name }}
      repo_name: ${{ steps.vars.outputs.repo_name }}
      admin_repo_name: ${{ steps.vars.outputs.admin_repo_name }}
      deploy_webhook: ${{ steps.vars.outputs.deploy_webhook }}
      notify_webhook: ${{ steps.vars.outputs.notify_webhook }}
      project_type: ${{ steps.vars.outputs.project_type }}
      docs_base_url: ${{ steps.vars.outputs.docs_base_url }}
    steps:
      - id: vars
        run: |
          echo "registry_url=${{ vars.REGISTRY_URL }}" >> $GITHUB_OUTPUT
          echo "registry_name=${{ vars.REGISTRY_NAME }}" >> $GITHUB_OUTPUT
          echo "repo_name=${{ vars.REPO_NAME }}" >> $GITHUB_OUTPUT
          echo "admin_repo_name=${{ vars.ADMIN_REPO_NAME }}" >> $GITHUB_OUTPUT
          echo "deploy_webhook=${{ vars.DEPLOY_WEBHOOK }}" >> $GITHUB_OUTPUT
          echo "notify_webhook=${{ vars.NOTIFY_WEBHOOK }}" >> $GITHUB_OUTPUT
          echo "project_type=${{ vars.PROJECT_TYPE }}" >> $GITHUB_OUTPUT
          echo "docs_base_url=${{ vars.DOCS_BASE_URL }}" >> $GITHUB_OUTPUT

  build:
    uses: ./.github/workflows/_build.yaml
    needs: bootstrap
    with:
      environment: development
      latest_tag: latest
      registry_url: ${{ needs.bootstrap.outputs.registry_url }}
      registry_name: ${{ needs.bootstrap.outputs.registry_name }}
      repo_name: ${{ needs.bootstrap.outputs.repo_name }}
    secrets:
      registry_username: ${{ secrets.REGISTRY_USERNAME }}
      registry_password: ${{ secrets.REGISTRY_PASSWORD }}

