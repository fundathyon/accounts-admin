services:
  admin:
    build: .
    ports:
      - "3001:3000"
    environment:
      INTERNAL_API_URL: http://localhost:8000/accounts
      ADMIN_API_KEY: secret
      ADMIN_USER: admin
      ADMIN_PASSWORD: changeme
      ADMIN_SESSION_SECRET: change-me-in-production
      SESSION_TTL: "86400"
      BASE_PATH: ""
      NEXT_PUBLIC_BASE_PATH: ""
